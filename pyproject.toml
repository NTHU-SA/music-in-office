[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "office-music-bot"
version = "0.1.0"
description = "Discord song requests played locally through YouTube Music on Windows"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.6,<3",
    "aiohttp>=3.12,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "pyinstaller>=6.16,<7",
]

[project.scripts]
office-music-bot = "office_music_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
